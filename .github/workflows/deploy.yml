name: Deploy Supabase Edge Functions

# ──────────────────────────────────────────────────────────────
# DESIGN WORKSPACE — nicbj96/b-social-design
#
# Dette repo deployer KUN til b-social-design.pages.dev (preview).
# Cloudflare's native git integration håndterer preview-deployet
# automatisk — ingen GitHub Actions nødvendig for frontend.
#
# Production (b-social.net) styres UDELUKKENDE af:
#   bbssocialnico-bit/b-social-pages → Cloudflare Worker b-social-pages
#
# Denne workflow deployer KUN Supabase Edge Functions.
# ──────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

jobs:
  deploy-edge-functions:
    runs-on: ubuntu-latest
    name: Deploy Supabase Edge Functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy send-push-notifications
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          supabase functions deploy send-push-notifications \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
